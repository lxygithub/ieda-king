name: idea_king
description: Receive shared files and display in day-grouped timeline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  receive_sharing_intent: ^1.8.1
  provider: ^6.1.2
  intl: ^0.20.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  mime: ^1.0.5
  uuid: ^4.4.0
  open_filex: ^4.4.0
  photo_view: ^0.15.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  aws_signature_v4: ^0.6.6
  aws_common: ^0.7.8
  crypto: ^3.0.7
  path: ^1.9.1
  minio: ^3.5.8
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.0
  flutter_slidable: ^3.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
